openapi: 3.0.3
info:
  title: Pedidos API
  description: Contrato para la creación y consulta de pedidos.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Entorno local

tags:
  - name: Pedidos
    description: Operaciones sobre pedidos

paths:
  /pedidos:
    post:
      tags: [Pedidos]
      summary: Crear un pedido
      operationId: crearPedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearPedidoRequest"
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Pedidos]
      summary: Consultar pedidos por cliente y por estado
      operationId: listarPedidosPorCliente
      parameters:
        - name: idCliente
          in: query
          required: true
          schema:
            type: string
        - name: estado
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EstadoPedido"
      responses:
        "200":
          description: Lista de pedidos del cliente que cumplen el filtro
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pedido"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /pedidos/{idPedido}:
    get:
      tags: [Pedidos]
      summary: Consultar pedido por id
      operationId: obtenerPedido
      parameters:
        - $ref: "#/components/parameters/IdPedido"
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /pedidos/{idPedido}/estado:
    patch:
      tags: [Pedidos]
      summary: Actualizar el estado de un pedido
      operationId: actualizarEstadoPedido
      parameters:
        - $ref: "#/components/parameters/IdPedido"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarEstadoRequest"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CambiarEstadoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La transición de estado solicitada no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    IdPedido:
      name: idPedido
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Pedido no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Canal:
      type: string
      enum: [APP, WEB]

    EstadoPedido:
      type: string
      enum:
        - CREADO
        - PAGADO
        - EN_PREPARACION
        - LISTO_PARA_RECOGER
        - ENTREGADO
        - CANCELADO

    LineaPedido:
      type: object
      required: [sku, cantidad, precio]
      properties:
        sku:
          type: string
          example: "SKU-00123"
        cantidad:
          type: integer
          format: int32
          minimum: 1
          example: 2
        precio:
          type: number
          format: double
          minimum: 0
          example: 19.9

    CrearPedidoRequest:
      type: object
      required: [idCliente, canal, lineasPedido, tiendaEntrega]
      properties:
        idCliente:
          type: string
          example: "CLI-98765"
        canal:
          $ref: "#/components/schemas/Canal"
        lineasPedido:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LineaPedido"
        tiendaEntrega:
          type: string
          description: Identificador de la tienda de entrega
          example: "T-01"

    Pedido:
      type: object
      required:
        - id
        - idCliente
        - canal
        - estado
        - lineasPedido
        - total
        - tiendaEntrega
        - fechaCreacion
        - fechaActualizacion
      properties:
        id:
          type: string
          format: uuid
          example: "3f8e1c52-7a0b-4c1e-9d55-0a1b2c3d4e5f"
        idCliente:
          type: string
          example: "CLI-98765"
        canal:
          $ref: "#/components/schemas/Canal"
        estado:
          $ref: "#/components/schemas/EstadoPedido"
        lineasPedido:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LineaPedido"
        total:
          type: number
          format: double
          minimum: 0
          description: Suma de cantidad × precio de las líneas del pedido
          example: 44.8
        tiendaEntrega:
          type: string
          description: Identificador de la tienda de entrega
          example: "T-01"
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    ActualizarEstadoRequest:
      type: object
      required: [estado]
      properties:
        estado:
          $ref: "#/components/schemas/EstadoPedido"

    CambiarEstadoResponse:
      type: object
      required: [id, estado, fechaActualizacion]
      properties:
        id:
          type: string
          format: uuid
          example: "3f8e1c52-7a0b-4c1e-9d55-0a1b2c3d4e5f"
        estado:
          $ref: "#/components/schemas/EstadoPedido"
        fechaActualizacion:
          type: string
          format: date-time

    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          example: "PEDIDO_NO_ENCONTRADO"
        mensaje:
          type: string
          example: "No se encontró el pedido solicitado"
        detalles:
          type: object
          additionalProperties: true
